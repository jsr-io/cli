[workspace]
resolver = "2"
members = ["cli", "src", "tests/util"]
default-members = ["cli", "src", "tests/util"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/jsr-io/cli"

[workspace.dependencies]
# deno crates, pinned to the versions used by Deno 2.9
deno_ast = { version = "=0.53.3" }
deno_cache_dir = "0.52.0"
deno_config = { version = "0.110.0", features = ["workspace"] }
deno_graph = { version = "=0.111.1", default-features = false, features = ["fast_check"] }
deno_error = "=0.7.1"
deno_maybe_sync = "0.47.0"
deno_npm_cache = "0.79.0"
deno_npm_installer = "0.55.0"
deno_npmrc = "0.21.0"
deno_media_type = { version = "=0.4.0", features = ["module_specifier"] }
deno_package_json = { version = "0.62.0", default-features = false }
deno_path_util = "=0.6.4"
deno_resolver = { version = "0.91.0", features = ["deno_ast", "graph"] }
deno_semver = "=0.10.1"
deno_terminal = "=0.2.3"
node_resolver = { version = "0.98.0" }
sys_traits = { version = "0.1.28", features = ["getrandom", "filetime", "libc", "serde_json", "real", "strip_unc", "winapi"] }

anyhow = "1.0.57"
aws-lc-rs = "1.18.2"
# like Deno, so release builds for x86_64 windows don't need NASM installed
aws-lc-sys = { version = "0.46.0", features = ["prebuilt-nasm"] }
async-trait = "0.1.73"
base64 = "0.22.1"
bytes = "1.11.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
env_logger = { version = "=0.11.6", default-features = false }
faster-hex = "0.10.0"
flate2 = { version = "1.0.30", default-features = false, features = ["zlib-ng-compat"] }
futures = "0.3.31"
http = "1.0"
http-body = "1.0"
http-body-util = "0.1.2"
log = "0.4.28"
once_cell = "1.17.1"
parking_lot = "0.12.0"
percent-encoding = "2.3.0"
p256 = { version = "0.13.2", features = ["ecdsa", "pem"] }
regex = "1.7.0"
reqwest = { version = "0.12.5", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1.0.149", features = ["derive"] }
serde_json = "1.0.85"
sha2 = { version = "0.10.8", features = ["oid"] }
spki = "0.7.2"
tar = "=0.4.46"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["full"] }
unicode-general-category = "1.1.0"
wasmparser = "0.244.0"
which = "8.0.0"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.3.0", features = ["v4"] }
lazy-regex = "3"
open = "5.0.1"

pretty_assertions = "=1.4.1"
