name: npm publish

# Publishes the jsr npm package from npm/ when a release is published. The
# package downloads the jsr binaries of that release, so it's built with their
# checksums.

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Write the CLI version and checksums
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node scripts/update-cli.ts "$TAG"
      - run: npm publish
