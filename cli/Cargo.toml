[package]
name = "jsr"
version = "0.1.0"
description = "The JSR command line tool"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "jsr"
path = "main.rs"

[dependencies]
jsr_cli = { path = "../src" }

anyhow.workspace = true
clap.workspace = true
deno_terminal.workspace = true
env_logger.workspace = true
log.workspace = true
tokio.workspace = true

[[test]]
name = "specs"
path = "../tests/specs/mod.rs"
harness = false

[[test]]
name = "publish"
path = "../tests/integration/publish_tests.rs"

[dev-dependencies]
test_util = { path = "../tests/util" }

anyhow.workspace = true
file_test_runner = "0.12.1"
serde.workspace = true
serde_json.workspace = true
